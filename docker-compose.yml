# The web app: an API over the audit core, plus a React frontend.
#   docker compose up --build    then open http://127.0.0.1:8080
#   Published images instead: set AUDIT_BACKEND_IMAGE / AUDIT_FRONTEND_IMAGE in .env, then
#   docker compose pull && docker compose up    (no --build, or it builds over them).
#
# SECURITY: ports bind to 127.0.0.1 only. The app serves a full map of an AWS account
# and has no authentication; exposing these ports means adding authentication first.

services:
  backend:
    # The image to run; `up --build` builds and tags it under this name, `pull` fetches it.
    image: ${AUDIT_BACKEND_IMAGE:-aws-cleanup-backend:local}
    build:
      # The repo root: the image needs aws_resource_audit/ as well as backend/.
      context: .
      dockerfile: backend/Dockerfile
      args:
        # The agent is off unless named here: openai, anthropic or bedrock. It sends
        # masked scan data to that provider. Set it in .env, then `docker compose up --build`.
        AUDIT_AGENT_PROVIDER: ${AUDIT_AGENT_PROVIDER:-none}
    environment:
      AUDIT_DATA_DIR: /data
      # Credentials arrive as a read-only Docker secret (see `secrets:` below).
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/aws_credentials
      # The agent's LLM API key file; empty or absent just disables the agent.
      AGENT_API_KEY_FILE: /run/secrets/llm_api_key
      # DEBUG also logs the agent's raw, unmasked LLM traffic (see README, Logging).
      # AUDIT_LOG_LEVEL: DEBUG
      # The [default] profile is used unless the Scan panel names one; or set AWS_PROFILE.
    volumes:
      # Snapshot, outputs, config, group names and uploaded documents: one mount,
      # so `docker compose down && up` loses nothing.
      - audit-data:/data
    secrets:
      - aws_credentials
      - llm_api_key
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # /api/health never reads the snapshot, so a server with no scan yet is healthy.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      # Check every 2s while starting, so the frontend's wait is seconds, not 30s.
      start_interval: 2s

  frontend:
    image: ${AUDIT_FRONTEND_IMAGE:-aws-cleanup-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    environment:
      # Where nginx sends /api and /files: this file's backend service.
      BACKEND_HOST: backend
    depends_on:
      # nginx resolves "backend" once at startup and exits if it fails; wait until healthy.
      backend:
        condition: service_healthy

volumes:
  audit-data:

secrets:
  # AUDIT_AWS_CREDENTIALS_FILE if set, else $HOME/.aws-audit/credentials.
  aws_credentials:
    file: ${AUDIT_AWS_CREDENTIALS_FILE:-${HOME}/.aws-audit/credentials}
  # The whole file is the key. Defaults to /dev/null (no agent), since Compose cannot make
  # a secret optional. To enable: AUDIT_LLM_API_KEY_FILE=/path/to/key in .env, then up --force-recreate.
  llm_api_key:
    file: ${AUDIT_LLM_API_KEY_FILE:-/dev/null}
