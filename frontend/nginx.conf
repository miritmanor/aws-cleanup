server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A reload on any path serves the app rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Generous timeouts: the default 60s would cut a slow synchronous request.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The generated report and its siblings, as a directory: the report links to
    # them by bare sibling filename.
    location /files/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # These pages map an AWS account: never cache them (and see the 127.0.0.1
    # binding in docker-compose.yml).
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
