name: ECS templates

# The deployment files, checked whenever they or what they are built from change.
on:
  pull_request:
    paths:
      - deploy/ecs/**
      - iam/**
      - tools/build_ecs_template.py
      - tools/changelog_release.py
      - tests/test_changelog_release.py
      - tests/test_ecs_template.py
      - tests/test_iam_role.py
      - .github/workflows/ecs-templates.yml
      - .github/workflows/release.yml
  push:
    branches: [main]
    paths:
      - deploy/ecs/**
      - iam/**
      - tools/build_ecs_template.py
      - tools/changelog_release.py
      - tests/test_changelog_release.py
      - tests/test_ecs_template.py
      - tests/test_iam_role.py
      - .github/workflows/ecs-templates.yml
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # boto3 for test_iam_role; cfn-lint for the templates.
      - name: Install
        run: pip install . cfn-lint
      - name: Generate the app template
        run: python tools/build_ecs_template.py --output build/ecs/aws-cleanup-app.yaml
      - name: Lint the templates
        run: cfn-lint deploy/ecs/base.yaml build/ecs/aws-cleanup-app.yaml iam/aws-audit-role.yaml
      - name: Lint the scripts
        working-directory: deploy/ecs
        run: shellcheck -x ./*.sh
      - name: Tests
        run: python -m unittest -v tests.test_ecs_template tests.test_iam_role tests.test_changelog_release
