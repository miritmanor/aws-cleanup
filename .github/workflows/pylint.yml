name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # The backend image's Python. The backend needs 3.11+; pylint 4 needs 3.10+.
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    # Both packages with their dependencies, or pylint reports every import as missing.
    # backend[dev] holds the pinned pylint.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . "./backend[dev]"
    # The same command as backend/Dockerfile. Config: pyproject.toml.
    - name: Analysing the code with pylint
      run: pylint aws_resource_audit backend/app
